redis:
  enabled: false

replicaCount:
  backend: 1

image:
  backend:
    repository: ghcr.io/example/backend
    tag: "latest"
    pullPolicy: IfNotPresent

service:
  backend:
    type: ClusterIP
    port: 80

backend:
  config:
    appName: "shop-backend"
    logLevel: "info"

instrumentation:
  enabled: true
  serviceName: backend
  exporterEndpoint: http://monitoring-stack-opentelemetry-collector.monitoring.svc.cluster.local:4317
