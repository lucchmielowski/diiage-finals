redis:
  enabled: false

replicaCount:
  backend: 1

image:
  backend:
    repository: ghcr.io/example/backend
    tag: "latest"
    pullPolicy: IfNotPresent

service:
  backend:
    type: ClusterIP
    port: 80

backend:
  config:
    appName: "shop-backend"
    logLevel: "info"

instrumentation:
  enabled: true
  serviceName: backend
  exporterEndpoint: http://monitoring-collector.monitoring.svc.cluster.local:4317

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

rbac:
  # Specifies whether RBAC resources should be created
  create: true
  # Rules to apply for the Role
  rules: []
