{{- if and .Values.serviceAccount.create .Values.rbac.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "diiage-finals-app.fullname" . }}-backend
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "diiage-finals-app.labels" . | nindent 4 }}
    app: {{ include "diiage-finals-app.name" . }}-backend
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "diiage-finals-app.fullname" . }}-backend
subjects:
  - kind: ServiceAccount
    name: {{ include "diiage-finals-app.fullname" . }}-backend
    namespace: {{ .Release.Namespace }}
{{- end }}
