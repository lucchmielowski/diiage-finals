{{- if and .Values.serviceAccount.create .Values.rbac.create .Values.rbac.clusterRolePods }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "diiage-finals-app.fullname" . }}-backend-pods
  labels:
    {{- include "diiage-finals-app.labels" . | nindent 4 }}
    app: {{ include "diiage-finals-app.name" . }}-backend
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["list", "get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "diiage-finals-app.fullname" . }}-backend-pods
  labels:
    {{- include "diiage-finals-app.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "diiage-finals-app.fullname" . }}-backend
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "diiage-finals-app.fullname" . }}-backend-pods
{{- end }}
