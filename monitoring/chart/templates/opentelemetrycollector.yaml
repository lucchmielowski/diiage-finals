{{- if .Values.opentelemetryCollector.enabled }}
apiVersion: opentelemetry.io/v1alpha1
kind: OpenTelemetryCollector
metadata:
  name: {{ .Values.opentelemetryCollector.name | default "monitoring-collector" }}
  namespace: {{ .Values.global.namespace | default "monitoring" }}
spec:
  mode: deployment
  image: {{ .Values.opentelemetryCollector.image | default "otel/opentelemetry-collector-contrib:latest" }}
  
  resources:
    {{- toYaml .Values.opentelemetryCollector.resources | nindent 4 }}
  
  config: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
      
      prometheus:
        config:
          scrape_configs:
            - job_name: 'otel-collector'
              scrape_interval: 10s
              static_configs:
                - targets: ['localhost:8888']
    
    processors:
      batch:
        timeout: 10s
        send_batch_size: 1024
      
      memory_limiter:
        check_interval: 1s
        limit_mib: 512
        spike_limit_mib: 128
    
    exporters:
      otlp/tempo:
        endpoint: {{ .Values.opentelemetryCollector.exporters.tempoEndpoint | default "monitoring-stack-tempo.monitoring.svc.cluster.local:4317" }}
        tls:
          insecure: true
      
      prometheusremotewrite:
        endpoint: {{ .Values.opentelemetryCollector.exporters.prometheusEndpoint | default "http://monitoring-stack-prometheus-server.monitoring.svc.cluster.local:80/api/v1/write" }}
        tls:
          insecure: true
      
      debug:
        verbosity: detailed
    
    service:
      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [otlp/tempo, debug]
        
        metrics:
          receivers: [otlp, prometheus]
          processors: [memory_limiter, batch]
          exporters: [prometheusremotewrite, debug]
        
        logs:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [debug]
{{- end }}
