{{- if .Values.instrumentation.enabled }}
apiVersion: opentelemetry.io/v1alpha1
kind: Instrumentation
metadata:
  name: {{ .Values.instrumentation.name | default "default-instrumentation" }}
  namespace: {{ .Values.instrumentation.namespace | default "prod" }}
spec:
  exporter:
    endpoint: {{ .Values.instrumentation.exporterEndpoint | default "monitoring-stack-opentelemetry-collector.monitoring.svc.cluster.local:4317" }}
  
  propagators:
    - tracecontext
    - baggage
    - b3
  
  sampler:
    type: parentbased_traceidratio
    argument: "1"
  
  env:
    - name: OTEL_SERVICE_NAME
      value: "{{ .Values.instrumentation.serviceName | default "backend" }}"
    - name: OTEL_EXPORTER_OTLP_ENDPOINT
      value: {{ .Values.instrumentation.exporterEndpoint | default "http://monitoring-stack-opentelemetry-collector.monitoring.svc.cluster.local:4317" | quote }}
    - name: OTEL_EXPORTER_OTLP_PROTOCOL
      value: "grpc"
    - name: OTEL_RESOURCE_ATTRIBUTES
      value: "service.name={{ .Values.instrumentation.serviceName | default "backend" }},service.namespace={{ .Values.instrumentation.namespace | default "prod" }}"
{{- end }}

---
{{- if .Values.instrumentation.trafficGenerator.enabled }}
apiVersion: opentelemetry.io/v1alpha1
kind: Instrumentation
metadata:
  name: {{ .Values.instrumentation.trafficGenerator.name | default "traffic-generator-instrumentation" }}
  namespace: {{ .Values.instrumentation.trafficGenerator.namespace | default "prod" }}
spec:
  exporter:
    endpoint: {{ .Values.instrumentation.exporterEndpoint | default "monitoring-stack-opentelemetry-collector.monitoring.svc.cluster.local:4317" }}
  
  propagators:
    - tracecontext
    - baggage
    - b3
  
  sampler:
    type: parentbased_traceidratio
    argument: "1"
  
  env:
    - name: OTEL_SERVICE_NAME
      value: "{{ .Values.instrumentation.trafficGenerator.serviceName | default "traffic-generator" }}"
    - name: OTEL_EXPORTER_OTLP_ENDPOINT
      value: {{ .Values.instrumentation.exporterEndpoint | default "http://monitoring-stack-opentelemetry-collector.monitoring.svc.cluster.local:4317" | quote }}
    - name: OTEL_EXPORTER_OTLP_PROTOCOL
      value: "grpc"
    - name: OTEL_RESOURCE_ATTRIBUTES
      value: "service.name={{ .Values.instrumentation.trafficGenerator.serviceName | default "traffic-generator" }},service.namespace={{ .Values.instrumentation.trafficGenerator.namespace | default "prod" }}"
{{- end }}
